<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pintinho Runner</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    #pontuacao {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 52px;
      font-weight: bold;
      color: #000;
      z-index: 5;
    }

    #relogio {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 32px;
      font-weight: bold;
      color: #000;
      z-index: 5;
    }

    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: red;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="jogo">
    <div id="pintinho"></div>
    <div id="ovo"></div>
    <div id="chao"></div>

    <div id="pontuacao">0</div>
    <div id="relogio">00:00</div>
    <div id="gameOver">Game Over</div>

    <button id="btnIniciar" onclick="iniciarJogo()">Iniciar</button>
    <button id="btnReiniciar" onclick="reiniciarJogo()" style="display:none;">Reiniciar</button>
    <button id="btnPulo" onclick="pular()" style="position: absolute; bottom: 80px; right: 20px; z-index: 10;">Pular</button>
    <button id="btnPulo" onclick="pular()">Pular</button>

    <audio id="somPulo" src="/imagem/audio.mp3"></audio>
    <audio id="somGameOver" src="/imagem/audio.mp3"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
